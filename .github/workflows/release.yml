name: Release

# GeoAIDesk releases are tag-driven drafts. Push a tag geo-v<version> that
# matches geo/distribution.json; the workflow checks the tag, builds the UI,
# writes the release manifest (with the actual app commit) and creates a DRAFT
# release for a maintainer to review and publish. The upstream workflow, which
# released v<server/package.json version> on every push to main, is replaced:
# an upstream version number is not a GeoAIDesk release.

on:
  push:
    tags: ["geo-v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.21'

      - name: Check the tag against geo/distribution.json
        run: node geo/release-manifest.mjs --verify-tag "$GITHUB_REF_NAME"

      - name: Geo checks
        run: node --test "geo/tests/*.test.mjs"

      - name: Build the production UI
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run build

      - name: Write release assets
        run: node geo/release-manifest.mjs --tag "$GITHUB_REF_NAME" --out dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [ "$(node -p "require('./geo/distribution.json').channel")" != "stable" ]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft $prerelease \
            --title "GeoAIDesk $GITHUB_REF_NAME" \
            --generate-notes
