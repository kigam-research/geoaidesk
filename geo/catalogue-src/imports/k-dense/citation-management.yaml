  kind: document
  formats: [markdown]
limitations:
- { kind: condition, text: { ko: "인터넷 연결과 Python requests 패키지가 필요합니다(선택 환경 '문헌 환경'). KIGAM 망(PC74, 2026-10-21 확인)에서 Crossref·OpenAlex는 응답했고 arXiv 검색 API는 응답하지 않았습니다." } }
- { kind: condition, text: { ko: "Google Scholar 검색은 scholarly 패키지가 추가로 필요하고 차단되기 쉽습니다. 기본 경로로 쓰지 않습니다." } }
- { kind: not-for, text: { ko: "GAID 서재의 인용 키와 참고문헌을 바꾸지 않습니다. 서재 항목은 서재 화면에서 고칩니다." } }
