  dataTypes: [document, catalog]
  formats: [json, markdown]
inputs:
- id: references
  label: { ko: "DOI 목록이나 참고문헌 파일(BibTeX)" }
  semanticType: document
  formats: [markdown, json]
  required: true
procedure:
  nodes:
  - { id: s1, code: S1, label: { ko: 논문 찾기 }, type: input, summary: { ko: "제목·DOI로 논문을 찾고 후보를 고릅니다" } }
  - { id: s2, code: S2, label: { ko: 서지 정보 확인 }, type: qa, summary: { ko: "DOI로 서지 정보를 받아 저자·연도·학술지를 대조합니다" } }
  - { id: s3, code: S3, label: { ko: BibTeX 정리 }, type: analysis, summary: { ko: "항목 형식을 맞추고 중복을 합칩니다" } }
  - { id: s4, code: S4, label: { ko: 인용 점검 }, type: output, summary: { ko: "틀린 DOI·빠진 칸·중복을 목록으로 보고합니다" } }
  edges:
  - { from: s1, to: s2, relation: next }
  - { from: s2, to: s3, relation: next }
  - { from: s3, to: s4, relation: next }
