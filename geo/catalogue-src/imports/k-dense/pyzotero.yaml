  - { id: s2, code: S2, label: { ko: 항목 읽기 }, type: analysis, summary: { ko: "항목·컬렉션·태그를 찾고 필요한 만큼 나눠 읽습니다" } }
  - { id: s3, code: S3, label: { ko: 쓰기 확인 }, type: human-gate, summary: { ko: "만들거나 고칠 내용을 연구자에게 보여 주고 확인을 받습니다" } }
  - { id: s4, code: S4, label: { ko: 결과 확인 }, type: output, summary: { ko: "항목별 성공·실패를 대조해 보고합니다" } }
