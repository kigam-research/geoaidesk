  formats: [json]
limitations:
- { kind: condition, text: { ko: "연구자가 요청할 때만 Zotero에 씁니다. 항목을 만들고 고치고 지울 수 있으므로 쓰기 전에 내용을 보여 주고 확인을 받습니다. 새 프로젝트에서는 꺼진 상태로 설치되고, 설정 → 스킬에서 켭니다." } }
- { kind: condition, text: { ko: "pyzotero 패키지가 필요합니다(선택 환경 '문헌 환경'). 웹 서재의 비공개 항목은 Zotero API 키, PC의 Zotero는 로컬 API 설정(쓰기는 Zotero 10 이상과 별도 승인)이 필요합니다." } }
- { kind: not-for, text: { ko: "GAID 서재의 Zotero 연결과 보내기를 대신하지 않습니다. 서재와 이어진 항목은 서재 화면에서 다룹니다." } }
