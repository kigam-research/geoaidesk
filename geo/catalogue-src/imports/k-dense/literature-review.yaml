limitations:
- { kind: condition, text: { ko: "검색 스크립트는 인터넷 연결과 Python requests 패키지가 필요합니다(선택 환경 '문헌 환경'). KIGAM 망(PC74, 2026-10-21 확인)에서 Semantic Scholar는 키 없이 요청 한도(429)에 걸렸고 arXiv 검색 API는 응답하지 않았습니다." } }
- { kind: condition, text: { ko: "PDF 출력은 Pandoc과 XeLaTeX, Parallel 검색 CLI는 Parallel 인증, AI 도식은 OPENROUTER_API_KEY가 필요합니다. GAID는 이들을 설치하지 않습니다." } }
- { kind: not-for, text: { ko: "메타분석 계산 도구는 없습니다. 계획까지만 돕습니다." } }
