summary: { ko: "질문과 포함·제외 기준을 정하고, 여러 서비스에서 검색한 기록을 남기고, 선별 건수를 세어 PRISMA 흐름을 만듭니다. 연구별 내용을 추출해 종합하고 모든 인용을 원문과 대조합니다." }
