  nodes:
  - { id: s1, code: S1, label: { ko: 질문과 범위 }, type: input, summary: { ko: "질문, 포함·제외 기준, 기간과 분야를 정합니다" } }
  - { id: s2, code: S2, label: { ko: 검색 기록 }, type: analysis, summary: { ko: "서비스별 검색어와 날짜를 남기며 검색합니다" } }
  - { id: s3, code: S3, label: { ko: 선별 }, type: decision, summary: { ko: "제목·초록, 전문 순으로 고르고 단계별 건수를 셉니다" } }
  - { id: s4, code: S4, label: { ko: 추출과 품질 평가 }, type: analysis, summary: { ko: "연구별 내용을 표로 추출하고 근거의 질을 평가합니다" } }
  - { id: s5, code: S5, label: { ko: 종합 }, type: analysis, summary: { ko: "주제별 또는 정량 종합을 쓰고 근거의 한계를 적습니다" } }
  - { id: s6, code: S6, label: { ko: 인용 대조와 문서 }, type: output, summary: { ko: "모든 인용을 원문과 대조하고 참고문헌이 있는 문서를 만듭니다" } }
